# =====================================================================
# MySQL 8.0 + 建库 SQL（静态交付文件）
# 2026-10-27 已实测：Docker Desktop 29.9.2 下 compose up -d 约 15s 转 healthy，
#       两份 schema.sql 自动建表（lab_reserve 3 表 / study_checkin 2 表）。
#
# 使用方法（装有 Docker Desktop 的机器）：
#   docker compose up -d          # 首次启动自动执行两个 schema.sql 建库
#   docker compose ps             # 等待 healthy
#   docker compose down -v        # 停止并清空数据卷
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: resume-python-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # docker-entrypoint-initdb.d 下的 SQL 仅在数据卷为空（首次启动）时自动执行
      - ./lab_reserve/schema.sql:/docker-entrypoint-initdb.d/01_lab_reserve.sql:ro
      - ./study_checkin/schema.sql:/docker-entrypoint-initdb.d/02_study_checkin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
